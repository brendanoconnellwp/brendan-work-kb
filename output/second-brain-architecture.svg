<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Brendan's Work KB second brain architecture</title>
  <desc id="desc">A readable architecture diagram showing sources flowing into raw capture, compiled wiki pages, index navigation, agent query, reusable outputs, and GitHub/Obsidian access.</desc>
  <defs>
    <style>
      .bg { fill: #020617; }
      .grid { stroke: #1e293b; stroke-width: 1; opacity: 0.55; }
      .boundary { fill: rgba(15, 23, 42, 0.34); stroke: #334155; stroke-width: 2; stroke-dasharray: 10 7; }
      .box-base { fill: #0f172a; }
      .source { fill: #1e293b; stroke: #94a3b8; }
      .process { fill: #064e3b; stroke: #34d399; }
      .store { fill: #4c1d95; stroke: #a78bfa; }
      .nav { fill: #78350f; stroke: #fbbf24; }
      .human { fill: #083344; stroke: #22d3ee; }
      .guard { fill: #881337; stroke: #fb7185; }
      .title { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-weight: 800; font-size: 34px; }
      .subtitle { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 22px; }
      .h { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-weight: 800; font-size: 25px; }
      .t { fill: #dbeafe; font-family: Inter, Arial, sans-serif; font-size: 18px; }
      .small { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 16px; }
      .tiny { fill: #94a3b8; font-family: Inter, Arial, sans-serif; font-size: 14px; }
      .label { fill: #e2e8f0; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #34d399; stroke-width: 4; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke: #a78bfa; stroke-width: 4; marker-end: url(#arrow-purple); }
      .arrow-yellow { fill: none; stroke: #fbbf24; stroke-width: 4; marker-end: url(#arrow-yellow); }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#94a3b8"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#34d399"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#a78bfa"/></marker>
    <marker id="arrow-yellow" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#fbbf24"/></marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <g opacity="0.75">
    <path class="grid" d="M0 80H1400 M0 160H1400 M0 240H1400 M0 320H1400 M0 400H1400 M0 480H1400 M0 560H1400 M0 640H1400 M0 720H1400 M0 800H1400"/>
    <path class="grid" d="M100 0V900 M200 0V900 M300 0V900 M400 0V900 M500 0V900 M600 0V900 M700 0V900 M800 0V900 M900 0V900 M1000 0V900 M1100 0V900 M1200 0V900 M1300 0V900"/>
  </g>

  <text x="70" y="70" class="title">Brendan's Work KB — second brain architecture</text>
  <text x="70" y="105" class="subtitle">A public GitHub repo + Obsidian vault + LLM-readable wiki that turns messy inputs into reusable knowledge.</text>

  <rect x="54" y="145" width="1292" height="640" rx="22" class="boundary"/>
  <text x="80" y="180" class="label">GitHub-backed Obsidian vault: brendanoconnellwp/brendan-work-kb</text>

  <!-- Main flow boxes -->
  <g>
    <rect x="80" y="235" width="215" height="180" rx="18" class="box-base"/>
    <rect x="80" y="235" width="215" height="180" rx="18" class="source" opacity="0.88"/>
    <text x="108" y="275" class="h">1. Inputs</text>
    <text x="108" y="310" class="t">• Web/docs/PDFs</text>
    <text x="108" y="340" class="t">• Daily dumps</text>
    <text x="108" y="370" class="t">• Work signals</text>
    <text x="108" y="398" class="tiny">Raw ideas enter here</text>
  </g>

  <path d="M 300 325 L 390 325" class="arrow-green"/>
  <text x="320" y="305" class="label">capture</text>

  <g>
    <rect x="400" y="235" width="215" height="180" rx="18" class="box-base"/>
    <rect x="400" y="235" width="215" height="180" rx="18" class="process" opacity="0.88"/>
    <text x="428" y="275" class="h">2. Research</text>
    <text x="428" y="310" class="t">Fetch + distill</text>
    <text x="428" y="340" class="t">Save source notes</text>
    <text x="428" y="370" class="t">YAML frontmatter</text>
    <text x="428" y="398" class="tiny">raw/articles, raw/daily</text>
  </g>

  <path d="M 620 325 L 710 325" class="arrow-green"/>
  <text x="640" y="305" class="label">compile</text>

  <g>
    <rect x="720" y="235" width="250" height="180" rx="18" class="box-base"/>
    <rect x="720" y="235" width="250" height="180" rx="18" class="store" opacity="0.88"/>
    <text x="748" y="275" class="h">3. Wiki articles</text>
    <text x="748" y="310" class="t">45 focused notes</text>
    <text x="748" y="340" class="t">11 topic areas</text>
    <text x="748" y="370" class="t">[[wikilinks]]</text>
    <text x="748" y="398" class="tiny">wiki/ compiled knowledge</text>
  </g>

  <path d="M 975 325 L 1065 325" class="arrow-purple"/>
  <text x="995" y="305" class="label">index</text>

  <g>
    <rect x="1075" y="235" width="245" height="180" rx="18" class="box-base"/>
    <rect x="1075" y="235" width="245" height="180" rx="18" class="nav" opacity="0.88"/>
    <text x="1103" y="275" class="h">4. Navigate</text>
    <text x="1103" y="310" class="t">_meta/_index.md</text>
    <text x="1103" y="340" class="t">Topic summaries</text>
    <text x="1103" y="370" class="t">Graph stays usable</text>
    <text x="1103" y="398" class="tiny">updated after changes</text>
  </g>

  <!-- Query / output / git row -->
  <path d="M 845 420 C 845 465 740 465 740 515" class="arrow-purple"/>
  <text x="755" y="470" class="label">query starts from wiki</text>

  <g>
    <rect x="545" y="515" width="310" height="170" rx="18" class="box-base"/>
    <rect x="545" y="515" width="310" height="170" rx="18" class="process" opacity="0.88"/>
    <text x="575" y="555" class="h">5. Hermes / LLM agent</text>
    <text x="575" y="592" class="t">Consult wiki first</text>
    <text x="575" y="622" class="t">Research only if needed</text>
    <text x="575" y="652" class="t">File durable insights back</text>
  </g>

  <path d="M 540 600 L 425 600" class="arrow"/>
  <text x="448" y="580" class="label">render</text>

  <g>
    <rect x="165" y="515" width="255" height="170" rx="18" class="box-base"/>
    <rect x="165" y="515" width="255" height="170" rx="18" class="human" opacity="0.88"/>
    <text x="195" y="555" class="h">6. Output</text>
    <text x="195" y="592" class="t">Diagrams</text>
    <text x="195" y="622" class="t">Drafts + demos</text>
    <text x="195" y="652" class="t">Reusable deliverables</text>
  </g>

  <path d="M 860 600 L 975 600" class="arrow-yellow"/>
  <text x="895" y="580" class="label">commit</text>

  <g>
    <rect x="980" y="515" width="255" height="170" rx="18" class="box-base"/>
    <rect x="980" y="515" width="255" height="170" rx="18" class="nav" opacity="0.88"/>
    <text x="1010" y="555" class="h">7. GitHub</text>
    <text x="1010" y="592" class="t">Version history</text>
    <text x="1010" y="622" class="t">Public demo repo</text>
    <text x="1010" y="652" class="t">Portable knowledge</text>
  </g>

  <!-- Guardrails: no overlap with green box -->
  <g>
    <rect x="90" y="715" width="1240" height="48" rx="14" class="guard" opacity="0.72"/>
    <text x="120" y="746" class="label">Guardrails: keep private client/employer details out of the public repo • update the index • keep raw sources separate from polished wiki pages</text>
  </g>

  <!-- Topic chips -->
  <text x="80" y="825" class="label">Current topic areas:</text>
  <text x="80" y="858" class="small">AI Agents · Agency AI Role · Cloudflare · Digital Anchor · Design-to-Dev · WordPress · Team RAG · Tooling · Team Adoption · Forecasts · Interests</text>
</svg>
