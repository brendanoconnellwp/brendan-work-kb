<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="t d">
  <title id="t">Brendan's Work KB second brain architecture</title>
  <desc id="d">Knowledge base architecture showing sources, research, wiki articles, navigation, agent query, outputs, and GitHub.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #475569; stroke-width: 2; }
      .g { fill: #064e3b; stroke: #34d399; stroke-width: 2; }
      .p { fill: #312e81; stroke: #818cf8; stroke-width: 2; }
      .y { fill: #422006; stroke: #fbbf24; stroke-width: 2; }
      .c { fill: #164e63; stroke: #22d3ee; stroke-width: 2; }
      .r { fill: #450a0a; stroke: #fb7185; stroke-width: 2; }
      .h { fill: #fff; font: bold 18px system-ui,sans-serif; }
      .t { fill: #cbd5e1; font: 14px system-ui,sans-serif; }
      .s { fill: #94a3b8; font: 13px system-ui,sans-serif; }
      .l { fill: #e2e8f0; font: bold 15px system-ui,sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="900" height="580"/>
  <rect x="28" y="95" width="120" height="80" rx="8" class="box"/>
  <text x="40" y="122" class="h">1. Sources</text>
  <text x="40" y="144" class="t">Web/docs/notes</text>
  <text x="40" y="162" class="t">Daily dumps</text>
  <rect x="210" y="95" width="120" height="80" rx="8" class="g"/>
  <text x="222" y="122" class="h">2. Research</text>
  <text x="222" y="144" class="t">Fetch + distill</text>
  <text x="222" y="162" class="t">raw/articles</text>
  <rect x="395" y="85" width="185" height="100" rx="8" class="p"/>
  <text x="410" y="114" class="h">3. Wiki articles</text>
  <text x="410" y="136" class="t">45 focused notes</text>
  <text x="410" y="155" class="t">11 topic areas</text>
  <text x="410" y="173" class="s">[[wikilinks]]</text>
  <rect x="645" y="95" width="155" height="80" rx="8" class="y"/>
  <text x="660" y="122" class="h">4. Navigate</text>
  <text x="660" y="144" class="t">_meta/_index.md</text>
  <text x="660" y="162" class="t">Topic summaries</text>
  <rect x="310" y="235" width="360" height="90" rx="8" class="g"/>
  <text x="328" y="265" class="h">5. LLM agent</text>
  <text x="328" y="287" class="t">Consult wiki first  research gaps  file back</text>
  <text x="328" y="310" class="s">WIKI_PATH + OBSIDIAN_VAULT_PATH</text>
  <rect x="95" y="235" width="125" height="90" rx="8" class="c"/>
  <text x="110" y="265" class="h">6. Output</text>
  <text x="110" y="287" class="t">Diagrams</text>
  <text x="110" y="310" class="t">Drafts + demos</text>
  <rect x="725" y="235" width="95" height="90" rx="8" class="y"/>
  <text x="738" y="265" class="h">7. Git</text>
  <text x="738" y="287" class="t">Versioned</text>
  <text x="738" y="310" class="t">Push to GH</text>
  <rect x="50" y="370" width="740" height="38" rx="8" class="r"/>
  <text x="68" y="396" class="l">Guardrails: no private employer/client info  update index on changes  raw/ separate from wiki</text>
  <text x="28" y="430" fill="#e2e8f0" font="bold 14px system-ui,sans-serif">Topic areas</text>
  <text x="28" y="453" fill="#94a3b8" font="12px system-ui,sans-serif">AI Agents  Agency AI Role  Cloudflare  Digital Anchor  Design-to-Dev  WordPress  Team RAG  Tooling  Team Adoption  Forecasts  Interests</text>
  <rect x="28" y="485" width="790" height="34" rx="8" class="y"/>
  <text x="46" y="508" fill="#e2e8f0" font="13px system-ui,sans-serif">brendanoconnellwp/brendan-work-kb  public repo, YouTube-demoable</text>
</svg>
